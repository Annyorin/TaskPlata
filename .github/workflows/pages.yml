name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '05-code/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 05-code/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build prototype
        working-directory: 05-code
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build -- --base="${PAGES_BASE%/}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: 05-code/dist
      - uses: actions/deploy-pages@v4
        id: deploy
