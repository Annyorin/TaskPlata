<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Ciudad de México</title>
<style>
  :root { font-family: Inter, system-ui, sans-serif; color: #292a2d; background: #f7f7f5; }
  * { box-sizing: border-box; }
  body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 16px; }
  .map { position: relative; width: min(100%, 390px); height: 64px; overflow: hidden;
    isolation: isolate; background: #f0efec; border: 1px solid #e9e8e4;
    border-radius: 22px; box-shadow: 0 12px 36px #24222412;
    transition: height 630ms cubic-bezier(.2,.85,.23,1), border-radius 630ms; }
  .map[data-open] { height: min(580px, calc(100svh - 32px)); border-radius: 28px; }
  .art, .loading { position: absolute; inset: 0; width: 100%; height: 100%; }
  .art { object-fit: cover; opacity: 0; transform: scale(1.12); transition: opacity 420ms, transform 850ms cubic-bezier(.2,.7,.25,1); }
  .map[data-open][data-ready] .art { opacity: 1; transform: scale(1); }
  .loading { pointer-events: none; opacity: 0; transition: opacity 280ms; background:
    linear-gradient(110deg, transparent 25%, #fff9 48%, transparent 70%) 100% 0 / 220% 100%,
    repeating-linear-gradient(31deg, #eae9e6 0 30px, #f6f5f2 30px 39px, #ebeae7 39px 72px, #f9f8f5 72px 81px); }
  .map[data-open]:not([data-ready]) .loading { opacity: 1; animation: sweep 900ms linear infinite; }
  @keyframes sweep { to { background-position: 0% 0, 0 0; } }
  button { position: absolute; z-index: 1; inset: 0 0 auto; width: 100%; height: 62px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 17px;
    border: 0; background: #fff; color: inherit; text-align: left; font: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid #46735d; outline-offset: -4px; border-radius: 20px; }
  .map[data-open] button { inset: 12px 12px auto; width: calc(100% - 24px); height: 44px;
    padding-inline: 12px; border-radius: 15px; background: #fffffff0; box-shadow: 0 2px 10px #25252512; }
  .icon { width: 18px; height: 18px; transition: transform 350ms; }
  .map[data-open] .icon { transform: rotate(180deg); }
  .status { position: absolute; bottom: 14px; left: 14px; margin: 0; font-size: 12px;
    background: #fff; padding: 6px 9px; border-radius: 8px; }
  .status:empty { display: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<section class="map" aria-label="Mapa de Ciudad de México">
  <img id="map-art" class="art" src="mexico-city-map.png" alt="Mapa ilustrado de las calles alrededor del Paseo de la Reforma" aria-hidden="true">
  <div class="loading" aria-hidden="true"></div>
  <button type="button" aria-expanded="false" aria-controls="map-art">
    Ciudad de México
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <p class="status" role="status"></p>
</section>
<script>
  const card = document.querySelector('.map');
  const toggle = card.querySelector('button');
  const art = card.querySelector('img');
  const status = card.querySelector('.status');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let opening = 0;

  toggle.addEventListener('click', async () => {
    const currentOpening = ++opening;
    const open = card.toggleAttribute('data-open');
    toggle.setAttribute('aria-expanded', String(open));
    art.setAttribute('aria-hidden', 'true');
    card.removeAttribute('data-ready');
    status.textContent = open ? 'Cargando mapa…' : '';
    if (!open) return;

    try {
      const revealDelay = reducedMotion.matches ? 0 : 420;
      await Promise.all([art.decode(), new Promise(resolve => setTimeout(resolve, revealDelay))]);
      if (currentOpening !== opening) return;
      card.setAttribute('data-ready', '');
      art.removeAttribute('aria-hidden');
      status.textContent = '';
    } catch {
      if (currentOpening !== opening) return;
      card.setAttribute('data-ready', '');
      status.textContent = 'No se pudo cargar el mapa.';
    }
  });
</script>
</body>
</html>
