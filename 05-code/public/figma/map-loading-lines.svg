<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 971 1619" preserveAspectRatio="xMidYMid slice">
  <style>
    path { fill: none; stroke: #b6bdba; stroke-width: 2; stroke-linecap: round;
      vector-effect: non-scaling-stroke; stroke-dasharray: 1; }
    .boulevard { stroke: #83bda4; stroke-width: 3; }
    @media (prefers-reduced-motion: no-preference) {
      path { animation: draw-street 1.5s var(--delay) cubic-bezier(.38,.03,.25,1) infinite both; }
    }
    @keyframes draw-street {
      0% { stroke-dashoffset: 1; opacity: 1; }
      65%, 85% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
  </style>
